<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematics | Calculus Test</title>
    <style>
        :root {
            --accent-blue: #00d4ff;
            --bg-dark: #0a0a0a;
            --card-bg: #161616;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .header {
            border-left: 4px solid var(--accent-blue);
            padding-left: 15px;
            margin-bottom: 30px;
        }

        h1 { color: var(--accent-blue); margin: 0; font-size: 1.8rem; }
        p { opacity: 0.7; margin-top: 5px; }

        .question-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 212, 255, 0.1);
            transition: 0.3s;
        }

        .question-card:hover {
            border-color: var(--accent-blue);
        }

        .q-text {
            font-size: 1.1rem;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        input[type="text"] {
            width: 100%;
            background: #000;
            border: 1px solid #444;
            padding: 12px;
            color: var(--accent-blue);
            border-radius: 5px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus { border-color: var(--accent-blue); }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        button {
            padding: 12px 25px;
            background: transparent;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        button:hover {
            background: var(--accent-blue);
            color: #000;
        }
    </style>
    
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>

</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="test-title">Calculus: Derivatives</h1>
        <p id="test-meta">Subject: Mathematics | Grade 12</p>
    </div>

    <div id="questions-container">
        </div>

<div id="system-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; display:none; justify-content:center; align-items:center; opacity:0; transition: 0.5s;">
    <div id="message-box" style="background:var(--card-bg); border: 2px solid var(--accent-blue); padding: 40px; border-radius: 15px; text-align:center; box-shadow: 0 0 30px rgba(0,212,255,0.2); max-width: 80%;">
        <h2 id="msg-title" style="color:var(--accent-blue); text-transform:uppercase; letter-spacing:3px; margin-top:0;"></h2>
        <p id="msg-body" style="font-size:1.1rem; line-height:1.6; color:#ccc;"></p>
        <button onclick="closeSystemMsg()" style="margin-top:20px; padding:10px 30px; background:transparent; color:var(--accent-blue); border:1px solid var(--accent-blue); cursor:pointer; font-weight:bold;">SESSION COMPLETE</button>
    </div>
</div>

<div id="result-score" style="margin-top: 20px; font-weight: bold; font-size: 1.2rem; color: var(--accent-blue); display: none;">
    SCORE: <span id="score-value">0</span> / <span id="total-value">0</span>
</div>

<div class="controls">
    <button onclick="location.href='../../test-hub.html'">BACK TO HUB</button>
    <button id="submit-btn">SUBMIT ANSWERS</button>
</div>

</div>

<script type="module" src="./test-telemetry.js"></script>


</body>
</html>
