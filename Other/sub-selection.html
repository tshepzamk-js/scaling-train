<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra Academy | Academic Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00d4ff;
            --bg: #050505;
            --item-h: 60px;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- ASTRA ACADEMY CENTERED LOGO BUTTON --- */
        .logo-home-btn {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            height: 100px; /* Matches the exact profile size of the homepage container */
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-home-btn img {
            height: 100%;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.3));
            transition: filter 0.2s ease;
        }

        .logo-home-btn:hover {
            transform: translateX(-50%) scale(1.03);
        }

        .logo-home-btn:hover img {
            filter: drop-shadow(0 0 15px var(--accent));
        }

        /* --- SYMMETRICAL MENU TAB --- */
        .menu-btn {
            position: fixed;
            top: 35px;
            left: 35px;
            z-index: 1000;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            padding: 10px;
        }

        .bar {
            width: 30px;
            height: 2px;
            background: var(--accent);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--accent);
            border-radius: 2px;
        }

        /* Symmetrical X Animation */
        .menu-btn.open #bar1 { transform: translateY(8px) rotate(-45deg); }
        .menu-btn.open #bar2 { opacity: 0; transform: translateX(-10px); }
        .menu-btn.open #bar3 { transform: translateY(-8px) rotate(45deg); }

        .sidenav {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            background: rgba(0, 8, 15, 0.98);
            backdrop-filter: blur(15px);
            overflow-x: hidden;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 1px solid rgba(0, 212, 255, 0.2);
        }

        .sidenav a {
            padding: 20px 40px;
            text-decoration: none;
            font-size: 1.1rem;
            color: #444;
            display: block;
            transition: 0.3s;
            letter-spacing: 3px;
        }

        .sidenav a:hover { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

        /* --- MAIN UI CONTAINER --- */
        .ui-wrapper {
            width: 100%;
            max-width: 450px;
            text-align: center;
            transform: translateY(-40px);
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 1.6rem;
            letter-spacing: 8px;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        /* --- PICKER SYSTEM --- */
        .picker-viewport {
            position: relative;
            height: 240px;
            width: 100%;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent, black 35%, black 65%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 35%, black 65%, transparent);
        }

        .target-brackets {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: var(--item-h);
            border-left: 2px solid var(--accent);
            border-right: 2px solid var(--accent);
            pointer-events: none;
            z-index: 10;
        }

        .scroll-list {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            padding-top: 90px; 
            padding-bottom: 90px; 
            box-sizing: border-box;
        }

        .scroll-list::-webkit-scrollbar { display: none; }

        .subject-item {
            height: var(--item-h);
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            font-size: 1.2rem;
            color: #1a1a1a;
            transition: all 0.4s ease;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- BUTTON --- */
        .btn-access {
            margin-top: 50px;
            background: rgba(0, 212, 255, 0.03);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 15px 45px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            letter-spacing: 2px;
        }

        .btn-access:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 30px var(--accent);
        }
    </style>
</head>
<body>

    <a href="../Homepage/homepage.html" class="logo-home-btn">
        <img src="../Images/1000008805-removebg-preview.png" alt="Astra Academy Logo">
    </a>

    <div class="menu-btn" id="menuBtn" onclick="toggleMenu()">
        <div class="bar" id="bar1"></div>
        <div class="bar" id="bar2"></div>
        <div class="bar" id="bar3"></div>
    </div>

    <div id="sideNav" class="sidenav">
        <div style="height: 120px;"></div>
        <a href="../Other/test-hub.html">ARCHIVED TESTS</a>
        <a href="#">ENCRYPTED</a>
        <a href="#">ENCRYPTED</a>
        <a href="#" style="color: #ff4d4d; margin-top: 40px;">UNKNOWN</a>
    </div>

    <div class="ui-wrapper">
        <h1>ACADEMIC ACCESS</h1>

        <div class="picker-viewport">
            <div class="target-brackets"></div>
            <div class="scroll-list" id="picker">
                </div>
        </div>

        <button class="btn-access" onclick="launch()">ACCESS MODULE</button>
    </div>

    <div class="player-hud" style="
        position: fixed;
        top: 30px;
        right: 30px;
        z-index: 1000;
        text-align: right;
        font-family: 'Orbitron', sans-serif;
        border-right: 2px solid var(--accent);
        padding-right: 8px;
        user-select: none;
    ">
        <div style="font-size: 8px; color: #64748b; letter-spacing: 1px; text-transform: uppercase; margin-bottom: -2px;">Authenticated</div>
        <div id="hudPlayerName" style="font-size: 13px; color: #fff; font-weight: 700; letter-spacing: 1.5px; text-shadow: 0 0 8px rgba(0, 212, 255, 0.4);">[ RECRUIT ]</div>
    </div>
    
    <script>

    // PARSE PLAYER DESIGNATION MEMORY LOGS
    document.addEventListener('DOMContentLoaded', () => {
        const savedName = localStorage.getItem('playerName');
        const hudDisplay = document.getElementById('hudPlayerName');
        
        if (savedName && savedName.trim() !== "") {
            hudDisplay.innerText = savedName.toUpperCase();
        } else {
            hudDisplay.innerText = "[ RECRUIT ]";
        }
    });
    
        const subjects = [
            { name: "Mathematics", url: "../Subjects/Mathematics/mathematics-ui.html" },
            { name: "Physical Sciences", url: "../Other/coming-soon.html" },
            { name: "Life Sciences", url: "../Other/coming-soon.html" },
            { name: "Geography", url: "../Other/coming-soon.html" },
            { name: "Sepedi HL", url: "../Other/coming-soon.html" },
            { name: "English FAL", url: "../Other/coming-soon.html" },
            { name: "Life Orientation", url: "../Other/coming-soon.html" }
        ];

        const picker = document.getElementById('picker');
        let currentSelection = "";

        // Generate Subject List
        subjects.forEach(sub => {
            const div = document.createElement('div');
            div.className = 'subject-item';
            div.innerText = sub.name;
            div.dataset.url = sub.url; 
            picker.appendChild(div);
        });

        // Handle the "Focus" effect on scroll
        picker.addEventListener('scroll', () => {
            const items = document.querySelectorAll('.subject-item');
            const viewportRect = picker.getBoundingClientRect();
            const centerPoint = viewportRect.top + (viewportRect.height / 2);

            items.forEach(item => {
                const itemRect = item.getBoundingClientRect();
                const itemCenter = itemRect.top + (itemRect.height / 2);
                const distance = Math.abs(centerPoint - itemCenter);
                
                if (distance < 35) {
                    item.style.color = "var(--accent)";
                    item.style.opacity = "1";
                    item.style.transform = "scale(1.15)";
                    item.style.textShadow = "0 0 15px var(--accent)";
                    currentSelection = item.dataset.url; 
                } else {
                    item.style.color = "#222";
                    item.style.opacity = "0.3";
                    item.style.transform = "scale(0.9)";
                    item.style.textShadow = "none";
                }
            });
        });

        // Initialize state after load
        window.onload = () => {
            picker.dispatchEvent(new Event('scroll'));
        };

        // Menu Toggle Logic
        function toggleMenu() {
            const btn = document.getElementById('menuBtn');
            const nav = document.getElementById('sideNav');
            btn.classList.toggle('open');
            nav.style.width = btn.classList.contains('open') ? "280px" : "0";
        }

        // Launch Function to handle navigation
        function launch() {
            if (currentSelection) {
                window.location.href = currentSelection;
            } else {
                alert("SYSTEM ERROR: NO SUBJECT SELECTED");
            }
        }
    </script>
</body>
</html>
