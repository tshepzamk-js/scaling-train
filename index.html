<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra Academy | Designation</title>
    <style>
        :root {
            --primary-cyan: #00D4FF;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0B1B2A;
            font-family: sans-serif; /* Or your preferred font */
            overflow: hidden;
        }

        #vanta-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .system-container {
            position: relative;
            z-index: 10;
            background: #0A141EB3;
            backdrop-filter: blur(10px);
            border: 2px solid var(--primary-cyan);
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            color: white;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .quest-header h2 {
            color: var(--primary-cyan);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--primary-cyan);
            margin-top: 0;
        }

        .input-group {
            margin: 20px 0;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--primary-cyan);
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            padding: 10px;
            color: white;
            outline: none;
            box-sizing: border-box; /* Important for width alignment */
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary-cyan);
            box-shadow: 0 0 5px var(--primary-cyan);
        }

        .accept-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--primary-cyan);
            color: var(--primary-cyan);
            cursor: pointer;
            font-weight: bold;
            transition: 0.4s;
            margin-top: 10px;
        }

        .accept-btn:hover {
            background: var(--primary-cyan);
            color: black;
            box-shadow: 0 0 20px var(--primary-cyan);
        }
    </style>
</head>
<body>
    <div id="vanta-background"></div>

    <div class="system-container">
        <div class="quest-header">
            <h2>[ QUEST: DESIGNATION ]</h2>
            <p>Will you accept the invitation to become a Player?</p>
        </div>

        <form class="signup-form">
            <div class="input-group">
                <label>PLAYER NAME</label>
                <input type="text" placeholder="Enter your name..." required>
            </div>

            <button type="submit" class="accept-btn">ACCEPT</button>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const signupForm = document.querySelector('.signup-form');
            
            if (signupForm) {
                signupForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    
                    // Grab the name to use in the system later
                    const playerName = signupForm.querySelector('input[type="text"]').value;
                 
                    localStorage.setItem('playerName', playerName);
                    
                    // Navigate to the next stage
                    // Ensure this path matches your file structure exactly
                    window.location.href = './Homepage/homepage.html';
                });
            }
        });
    </script>

    <script>
        VANTA.NET({
            el: "#vanta-background",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x00d4ff,
            backgroundColor: 0x0b1b2a,
            points: 10.00,
            maxDistance: 20.00,
            spacing: 15.00
        });
    </script>
</body>
</html>
