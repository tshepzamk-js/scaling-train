<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra Academy | Designation</title>
    <style>
        :root {
            --primary-cyan: #00D4FF;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0B1B2A;
            font-family: sans-serif;
            overflow: hidden;
        }

        #vanta-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .system-container {
            position: relative;
            z-index: 10;
            background: #0A141EB3;
            backdrop-filter: blur(10px);
            border: 2px solid var(--primary-cyan);
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            color: white;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .quest-header h2 {
            color: var(--primary-cyan);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--primary-cyan);
            margin-top: 0;
        }

        .input-group {
            margin: 20px 0;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--primary-cyan);
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            padding: 10px;
            color: white;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary-cyan);
            box-shadow: 0 0 5px var(--primary-cyan);
        }

        .accept-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--primary-cyan);
            color: var(--primary-cyan);
            cursor: pointer;
            font-weight: bold;
            transition: 0.4s;
            margin-top: 10px;
        }

        .accept-btn:hover {
            background: var(--primary-cyan);
            color: black;
            box-shadow: 0 0 20px var(--primary-cyan);
        }
    </style>
</head>
<body>
    <div id="vanta-background"></div>

    <div class="system-container">
        <div class="quest-header">
            <h2>[ QUEST: DESIGNATION ]</h2>
            <p>Will you accept the invitation to become a Player?</p>
        </div>

        <form class="signup-form">
            <div class="input-group">
                <label>PLAYER NAME</label>
                <input type="text" placeholder="Enter your name..." required>
            </div>

            <button type="submit" class="accept-btn">ACCEPT</button>
        </form>
    </div>

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

    <!-- Vanta Background Initialization -->
    <script>
        VANTA.NET({
            el: "#vanta-background",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x00d4ff,
            backgroundColor: 0x0b1b2a,
            points: 10.00,
            maxDistance: 20.00,
            spacing: 15.00
        });
    </script>
    
    <!-- Single Form Submission & Firebase Registration Script -->
    <script type="module">
      import { db } from './src/firebase.config.js';
      import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      document.addEventListener('DOMContentLoaded', () => {
        const signupForm = document.querySelector('.signup-form');

        if (signupForm) {
          signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nameInput = signupForm.querySelector('input[type="text"]');
            const playerName = nameInput ? nameInput.value.trim() : '';

            if (!playerName) return;

            // Store in localStorage for immediate client-side UI sync
            localStorage.setItem('playerName', playerName);

            try {
              // Register user in Firebase Firestore
              const docRef = await addDoc(collection(db, "users"), {
                name: playerName,
                createdAt: serverTimestamp()
              });

              // Save unique document ID to link test telemetry
              localStorage.setItem('userId', docRef.id);
            } catch (error) {
              console.error("[Astra System]: Firebase Registration Failed:", error);
            } finally {
              // Proceed to Homepage regardless of network state
              window.location.href = './Homepage/homepage.html';
            }
          });
        }
      });
    </script>

</body>
</html>
