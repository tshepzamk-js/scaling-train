<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra Academy | Designation</title>
    <!-- Orbitron Font[span_2](start_span)[span_2](end_span) -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-cyan: #00D4FF;
            --bg-dark: #0B1B2A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-dark);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
        }

        #vanta-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .system-container {
            position: relative;
            z-index: 10;
            background: rgba(10, 20, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--primary-cyan);
            padding: 2.5rem 2rem;
            width: 90%;
            max-width: 420px;
            color: white;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.25);
            border-radius: 4px;
        }

        .quest-header h2 {
            color: var(--primary-cyan);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--primary-cyan);
            margin-bottom: 0.5rem;
            font-size: 1.25rem;
            text-transform: uppercase;
        }

        .quest-header p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        .input-group {
            margin: 20px 0;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--primary-cyan);
            margin-bottom: 8px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.3);
            padding: 12px 14px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        input:focus {
            border-color: var(--primary-cyan);
            box-shadow: 0 0 12px var(--primary-cyan);
            background: rgba(0, 212, 255, 0.08);
        }

        .accept-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--primary-cyan);
            color: var(--primary-cyan);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            clip-path: polygon(6% 0%, 100% 0%, 94% 100%, 0% 100%);
        }

        .accept-btn:hover {
            background: var(--primary-cyan);
            color: #030712;
            box-shadow: 0 0 20px var(--primary-cyan);
        }

        .accept-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- Background Animation Layer[span_3](start_span)[span_3](end_span) -->
    <div id="vanta-background"></div>

    <!-- Interface Panel[span_4](start_span)[span_4](end_span) -->
    <div class="system-container">
        <div class="quest-header">
            <h2>[ QUEST: DESIGNATION ]</h2>
            <p>Will you accept the invitation to become a Player?</p>
        </div>

        <form class="signup-form">
            <div class="input-group">
                <label for="playerName">PLAYER NAME</label>
                <input 
                    type="text" 
                    id="playerName" 
                    placeholder="Enter designation..." 
                    autocomplete="off" 
                    required
                >
            </div>

            <button type="submit" class="accept-btn">ACCEPT</button>
        </form>
    </div>

    <!-- External Libraries[span_5](start_span)[span_5](end_span) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

    <!-- Vanta Background Initialization[span_6](start_span)[span_6](end_span) -->
    <script>
        VANTA.NET({
            el: "#vanta-background",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x00d4ff,
            backgroundColor: 0x0b1b2a,
            points: 10.00,
            maxDistance: 20.00,
            spacing: 15.00
        });
    </script>
    
    <!-- Form Submission Script with Initializing State & Local Storage[span_7](start_span)[span_7](end_span)[span_8](start_span)[span_8](end_span) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const signupForm = document.querySelector('.signup-form');

            if (signupForm) {
                signupForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    
                    const nameInput = document.getElementById('playerName');
                    const playerName = nameInput ? nameInput.value.trim() : '';

                    if (!playerName) return;

                    const submitBtn = signupForm.querySelector('.accept-btn');
                    if (submitBtn) {
                        submitBtn.innerText = "INITIALIZING...";
                        submitBtn.disabled = true;
                    }

                    // Save to local storage[span_9](start_span)[span_9](end_span)
                    localStorage.setItem('playerName', playerName);

                    // Redirect to Homepage[span_10](start_span)[span_10](end_span)[span_11](start_span)[span_11](end_span)
                    setTimeout(() => {
                        window.location.href = './Homepage/homepage.html';
                    }, 400);
                });
            }
        });
    </script>
    
    <script>
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "firebase/app";
        import { getAnalytics } from "firebase/analytics";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries
        
        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyDjx8V9l6EXNPPNoGsMhUk8PlSHIsIUFcE",
            authDomain: "scaling-train-54894.firebaseapp.com",
            databaseURL: "https://scaling-train-54894-default-rtdb.firebaseio.com",
            projectId: "scaling-train-54894",
            storageBucket: "scaling-train-54894.firebasestorage.app",
            messagingSenderId: "811725820748",
            appId: "1:811725820748:web:7ba2cefe1d287eaf06f5e9",
            measurementId: "G-4S3WX6P18L"
        };
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
    </script>
</body>
</html>
