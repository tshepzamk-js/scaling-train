<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematics | Calculus Test</title>
    <link rel="stylesheet" href="../../styles/test-style.css">
    
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
      };
    </script>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-info">
            <h1 id="test-title">Loading...</h1>
            <p id="test-meta">Subject: ...</p>
        </div>
        <div class="stopwatch-wrapper">
            <span class="timer-icon">⏱️</span>
            <span id="stopwatch">00:00</span>
        </div>
    </div>

    <div id="questions-container"></div>

    <div id="system-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(3,7,18,0.95); z-index:1000; display:none; justify-content:center; align-items:center; opacity:0; transition: 0.5s;">
        <div id="message-box" style="background:#0c1020; border: 2px solid var(--accent-theme); padding: 40px; border-radius: 24px; text-align:center; box-shadow: 0 0 50px rgba(0,0,0,0.8); max-width: 80%;">
            <h2 id="msg-title" style="color:var(--accent-theme); text-transform:uppercase; letter-spacing:3px; margin-top:0;"></h2>
            <p id="msg-body" style="font-size:1.1rem; line-height:1.6; color:#cbd5e1;"></p>
            <button class="action-btn" onclick="closeSystemMsg()" style="margin-top:20px;">SESSION COMPLETE</button>
        </div>
    </div>

    <div id="result-score">
        SYNC ACCURACY: <span id="score-value">0</span> / <span id="total-value">0</span>
        <span class="time-tag">Time Elapsed: <span id="time-value">00:00</span></span>
    </div>

    <div class="controls">
        <button class="action-btn" onclick="location.href='../../test-hub.html'">BACK TO HUB</button>
        <button class="action-btn" onclick="submitTest()">SUBMIT ANSWERS</button>
    </div>
</div>

<script>
// --- STOPWATCH ENGINE ---
let timerInterval = null;
let secondsElapsed = 0;

function startStopwatch() {
    secondsElapsed = 0;
    timerInterval = setInterval(() => {
        secondsElapsed++;
        document.getElementById('stopwatch').innerText = formatTime(secondsElapsed);
    }, 1000);
}

function stopStopwatch() {
    clearInterval(timerInterval);
}

function formatTime(totalSeconds) {
    const mins = Math.floor(totalSeconds / 60);
    const secs = totalSeconds % 60;
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

// --- MASTER STUDY CONFIGURATION DATA GRID ---

// --- CORE ENGINE LOGIC ---

function initializeTheme() {
    const metaText = testData.meta;
    let themeColor = "#00d4ff"; 
    
    const rankColors = {
        'sss': '#ff0000', 'ss': '#ffaa00', 's': '#f8d7da',   
        'a': '#ffe5d0',   'b': '#fff3cd',  'c': '#d1e7dd',   
        'd': '#d0e7ff',   'e': '#f0f0f0'    
    };

    const rankMatch = metaText.match(/Rank\s*:\s*([a-z]+)/i);
    let updatedMetaHTML = metaText;

    if (rankMatch && rankMatch[1]) {
        const targetRank = rankMatch[1].toLowerCase();
        if (rankColors[targetRank]) {
            themeColor = rankColors[targetRank];
            const matchedString = rankMatch[0];
            updatedMetaHTML = metaText.replace(matchedString, `<span class="rank-highlight">${matchedString}</span>`);
        }
    }

    document.documentElement.style.setProperty('--accent-theme', themeColor);
    const name = localStorage.getItem('playerName') || "User";
    document.getElementById('test-meta').innerHTML = `${updatedMetaHTML} | Active Session: ${name}`;
}

function loadTest() {
    initializeTheme();
    document.getElementById('test-title').innerText = testData.title;

    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    
    testData.questions.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        
        let imageHTML = '';
        if (item.img) {
            imageHTML = `
                <div class="q-image-wrapper">
                    <img src="${item.img}" alt="Question Axis Component Grid">
                </div>`;
        }

        let tipHTML = '';
        if (item.tip) {
            tipHTML = `
                <div class="q-tip">
                    <span>💡</span>
                    <div>${item.tip}</div>
                </div>`;
        }
        
        if (item.type === "multipart") {
            let subsHTML = `<div class="subquestions-container">`;
            item.subquestions.forEach((sub) => {
                let inputsHTML = `<div class="inputs-wrapper">`;
                sub.inputs.forEach((label, i) => {
                    inputsHTML += `
                        <div class="input-group">
                            ${sub.inputs.length > 1 ? `<span class="input-prefix">${label}:</span>` : ''}
                            <input type="text" placeholder="Type data..." id="ans-${item.id}-${sub.subId}-${i}">
                        </div>`;
                });
                inputsHTML += `</div>`;

                subsHTML += `
                    <div class="sub-item">
                        <div class="sub-q-text"><strong>${sub.subId}:</strong> ${sub.q}</div>
                        ${inputsHTML}
                        <button id="sol-btn-${item.id}-${sub.subId}" class="toggle-solution-btn" onclick="toggleSolution('${item.id}-${sub.subId}')">VIEW CORRECTION METHOD</button>
                        <div id="drawer-${item.id}-${sub.subId}" class="correction-drawer">
                            <div class="correction-content">
                                <div class="correction-title">Analysis & Methods (${sub.subId})</div>
                                <div>${sub.solution || "No correction track loaded."}</div>
                            </div>
                        </div>
                    </div>`;
            });
            subsHTML += `</div>`;

            card.innerHTML = `
                <div class="q-text"><strong>Q${index + 1}:</strong> ${item.q}</div>
                ${imageHTML}
                ${tipHTML}
                ${subsHTML}
            `;
        } else {
            let inputLabels = item.inputs || ["Answer"];
            let inputsHTML = `<div class="inputs-wrapper">`;
            inputLabels.forEach((label, i) => {
                inputsHTML += `
                    <div class="input-group">
                        ${inputLabels.length > 1 ? `<span class="input-prefix">${label}:</span>` : ''}
                        <input type="text" placeholder="Type data..." id="ans-${item.id}-${i}">
                    </div>`;
            });
            inputsHTML += `</div>`;

            card.innerHTML = `
                <div class="q-text"><strong>Q${index + 1}:</strong> ${item.q}</div>
                ${imageHTML}
                ${tipHTML}
                ${inputsHTML}
                <button id="sol-btn-${item.id}" class="toggle-solution-btn" onclick="toggleSolution('${item.id}')">VIEW CORRECTION METHOD</button>
                <div id="drawer-${item.id}" class="correction-drawer">
                    <div class="correction-content">
                        <div class="correction-title">Analysis & Methods</div>
                        <div>${item.solution || "No correction track loaded."}</div>
                    </div>
                </div>
            `;
        }
        container.appendChild(card);
    });
    
    MathJax.typesetPromise();
    startStopwatch(); // Trigger Stopwatch start when test mounts
}

function validateAnswer(userVal, correctVal) {
    let cleanUser = userVal.trim().toLowerCase().replace(/\s+/g, '');
    
    if (Array.isArray(correctVal) && correctVal.length === 2 && typeof correctVal[0] === 'number') {
        let userNum = parseFloat(cleanUser.replace(/[^\d.-]/g, ''));
        if (isNaN(userNum)) return false;
        return userNum >= correctVal[0] && userNum <= correctVal[1];
    }
    
    if (Array.isArray(correctVal)) {
        return correctVal.some(option => {
            let cleanOption = String(option).trim().toLowerCase().replace(/\s+/g, '');
            if (cleanUser === cleanOption) return true;
            let uRaw = cleanUser.includes('=') ? cleanUser.split('=')[1] : cleanUser;
            let oRaw = cleanOption.includes('=') ? cleanOption.split('=')[1] : cleanOption;
            return uRaw === oRaw && uRaw !== "";
        });
    }
    
    let cleanCorrect = String(correctVal).trim().toLowerCase().replace(/\s+/g, '');
    if (cleanUser === cleanCorrect) return true;
    
    let userRawValue = cleanUser.includes('=') ? cleanUser.split('=')[1] : cleanUser;
    let correctRawValue = cleanCorrect.includes('=') ? cleanCorrect.split('=')[1] : cleanCorrect;
    
    return userRawValue === correctRawValue && userRawValue !== "";
}

function submitTest() {
    stopStopwatch(); // Halt Timer on completion
    const totalCompletionTime = formatTime(secondsElapsed);

    let grandTotalPoints = 0;
    let totalEarnedPoints = 0;
    
    testData.questions.forEach((item) => {
        if (item.type === "multipart") {
            item.subquestions.forEach((sub) => {
                sub.inputs.forEach((_, i) => {
                    grandTotalPoints++;
                    const inputField = document.getElementById(`ans-${item.id}-${sub.subId}-${i}`);
                    const uVal = inputField.value;
                    const cVal = sub.ans[i] !== undefined ? sub.ans[i] : sub.ans;
                    
                    if (validateAnswer(uVal, cVal)) {
                        inputField.style.borderColor = varColor('--success-green');
                        inputField.style.backgroundColor = "rgba(46, 204, 113, 0.06)";
                        totalEarnedPoints++;
                    } else {
                        inputField.style.borderColor = varColor('--error-red');
                        inputField.style.backgroundColor = "rgba(231, 76, 60, 0.06)";
                        
                        if (Array.isArray(cVal) && typeof cVal[0] === 'number') {
                            inputField.placeholder = `Range: ${cVal[0]}-${cVal[1]}`;
                        } else if (Array.isArray(cVal)) {
                            inputField.placeholder = `Expected: ${cVal.join(' or ')}`;
                        } else {
                            inputField.placeholder = `Expected: ${cVal}`;
                        }
                    }
                    inputField.disabled = true;
                });
                document.getElementById(`sol-btn-${item.id}-${sub.subId}`).style.display = "inline-block";
            });
        } else {
            let inputLabels = item.inputs || ["Answer"];
            inputLabels.forEach((_, i) => {
                grandTotalPoints++;
                const inputField = document.getElementById(`ans-${item.id}-${i}`);
                const uVal = inputField.value;
                const cVal = item.ans[i] !== undefined ? item.ans[i] : item.ans;
                
                if (validateAnswer(uVal, cVal)) {
                    inputField.style.borderColor = varColor('--success-green');
                    inputField.style.backgroundColor = "rgba(46, 204, 113, 0.06)";
                    totalEarnedPoints++;
                } else {
                    inputField.style.borderColor = varColor('--error-red');
                    inputField.style.backgroundColor = "rgba(231, 76, 60, 0.06)";
                    
                    if (Array.isArray(cVal) && typeof cVal[0] === 'number') {
                        inputField.placeholder = `Range: ${cVal[0]}-${cVal[1]}`;
                    } else if (Array.isArray(cVal)) {
                        inputField.placeholder = `Expected: ${cVal.join(' or ')}`;
                    } else {
                        inputField.placeholder = `Expected: ${cVal}`;
                    }
                }
                inputField.disabled = true;
            });
            document.getElementById('sol-btn-' + item.id).style.display = "inline-block";
        }
    });
    
    const scoreContainer = document.getElementById('result-score');
    scoreContainer.style.display = "block";
    document.getElementById('score-value').innerText = totalEarnedPoints;
    document.getElementById('total-value').innerText = grandTotalPoints;
    document.getElementById('time-value').innerText = totalCompletionTime;
    
    const percentage = (totalEarnedPoints / grandTotalPoints) * 100;
    if (percentage >= 80) {
        showSystemMsg("Sync Complete", `Distinction Level achieved in ${totalCompletionTime}. The core logic is flawless. Meridian Prime is fully optimized.`);
    } else if (percentage >= 50) {
        showSystemMsg("System Warning", `Analysis passed in ${totalCompletionTime}, but interference detected. Review the nodes to reach peak performance.`);
    } else {
        showSystemMsg("Critical Error", `Logic failure in the assessment phase (${totalCompletionTime}). Reboot your study sequence and try again.`);
    }
}

function varColor(varName) {
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}

function toggleSolution(combinedId) {
    const drawer = document.getElementById(`drawer-${combinedId}`);
    if (drawer.style.maxHeight && drawer.style.maxHeight !== "0px") {
        drawer.style.maxHeight = "0px";
    } else {
        drawer.style.maxHeight = drawer.scrollHeight + "px";
    }
}

function showSystemMsg(title, body) {
    const savedName = localStorage.getItem('playerName') || "Candidate";
    const overlay = document.getElementById('system-overlay');
    document.getElementById('msg-title').innerText = title;
    document.getElementById('msg-body').innerText = `Salutations, ${savedName}. ${body}`;
    overlay.style.display = 'flex';
    setTimeout(() => { overlay.style.opacity = '1'; }, 10);
}

function closeSystemMsg() {
    const overlay = document.getElementById('system-overlay');
    overlay.style.opacity = '0';
    setTimeout(() => { overlay.style.display = 'none'; }, 500);
}

window.onload = () => {
    loadTest();
};
</script>

</body>
</html>
