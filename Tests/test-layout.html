<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra Academy | Assessment Engine</title>
    <style>
        :root {
            --accent-theme: #00d4ff; 
            --bg-dark: #030712; 
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.08);
            --success-green: #2ecc71;
            --error-red: #e74c3c;
        }

        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.003) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.003) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
            background-attachment: fixed;
        }

        .container { width: 100%; max-width: 750px; }

        .header {
            border-left: 4px solid var(--accent-theme);
            padding: 5px 0 5px 20px;
            margin-bottom: 40px;
            background: linear-gradient(to right, rgba(255, 255, 255, 0.01), transparent);
            border-radius: 4px;
            transition: border-color 0.5s ease;
        }

        h1 { 
            color: var(--accent-theme); 
            margin: 0; font-size: 2.2rem; 
            letter-spacing: -0.02em; font-weight: 800;
            transition: color 0.5s ease;
        }
        
        p { color: #94a3b8; margin-top: 8px; font-size: 0.95rem; }
        
        .rank-highlight {
            color: var(--accent-theme); font-weight: 900;
            text-transform: uppercase; font-family: 'Courier New', monospace;
            padding: 2px 6px; background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--accent-theme); border-radius: 4px;
        }

        .question-card {
            background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 30px; border-radius: 20px; margin-bottom: 30px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .question-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.8), 0 0 25px -5px var(--accent-theme);
        }

        .q-text { font-size: 1.15rem; margin-bottom: 20px; line-height: 1.7; color: #f1f5f9; }

        .q-tip {
            font-size: 0.9rem; color: var(--accent-theme);
            background: rgba(0, 0, 0, 0.2); border: 1px dashed var(--accent-theme);
            padding: 12px 16px; border-radius: 8px; margin-bottom: 20px;
            display: flex; align-items: flex-start; gap: 8px; opacity: 0.85;
        }

        .q-image-wrapper {
            margin: 15px 0 25px 0; border-radius: 12px; overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 0, 0, 0.3);
            max-width: 100%; display: flex; justify-content: center;
        }

        .q-image-wrapper img { max-width: 100%; height: auto; display: block; object-fit: contain; }

        .subquestions-container {
            display: flex; flex-direction: column; gap: 24px;
            margin-top: 20px; padding-left: 20px; border-left: 1px dashed rgba(255, 255, 255, 0.15);
        }

        .sub-item { background: rgba(0, 0, 0, 0.2); padding: 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.02); }
        .sub-q-text { font-size: 1.05rem; margin-bottom: 14px; color: #cbd5e1; line-height: 1.6; }
        .inputs-wrapper { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 5px; }
        .input-group { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 150px; }
        .input-prefix { font-size: 0.95rem; color: #64748b; font-weight: 600; }

        input[type="text"] {
            width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 16px; color: #ffffff; border-radius: 10px; outline: none;
            box-sizing: border-box; font-size: 1rem; font-family: inherit; transition: all 0.2s ease;
        }

        input:focus { border-color: var(--accent-theme); background: rgba(0, 0, 0, 0.6); }

        .toggle-solution-btn {
            background: transparent !important; border: 1px dashed rgba(255, 255, 255, 0.2) !important;
            color: #94a3b8 !important; padding: 10px 18px !important; border-radius: 8px !important;
            font-size: 0.85rem !important; font-weight: 600 !important; cursor: pointer !important;
            margin-top: 15px !important; display: none; transition: all 0.2s ease !important;
            text-transform: uppercase !important; letter-spacing: 0.5px !important; box-shadow: none !important;
        }

        .toggle-solution-btn:hover { border-color: var(--accent-theme) !important; color: var(--accent-theme) !important; background: rgba(255, 255, 255, 0.02) !important; }
        .correction-drawer { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1); background: rgba(0, 0, 0, 0.4); border-radius: 10px; margin-top: 15px; }
        .correction-content { padding: 20px; border-left: 3px solid var(--accent-theme); font-size: 0.95rem; line-height: 1.65; color: #94a3b8; }
        .correction-title { font-weight: 700; color: var(--accent-theme); margin-bottom: 8px; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1.5px; }
        .controls { display: flex; justify-content: space-between; margin-top: 50px; }

        .action-btn {
            padding: 14px 30px; background: transparent; color: var(--accent-theme); border: 1px solid var(--accent-theme);
            cursor: pointer; border-radius: 10px; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.5px; transition: all 0.2s ease;
        }

        .action-btn:hover { background: var(--accent-theme); color: #030712; box-shadow: 0 0 20px rgba(255, 255, 255, 0.1); }

        #result-score {
            margin-top: 30px; font-weight: 700; font-size: 1.3rem; letter-spacing: 1.5px;
            color: var(--accent-theme); display: none; text-align: center; background: rgba(0, 0, 0, 0.3);
            padding: 20px; border-radius: 12px; border: 1px dashed rgba(255, 255, 255, 0.08);
        }
    </style>
    
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
      window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
    </script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="test-title">Loading Parameters...</h1>
        <p id="test-meta">Subject: Matrix Initialization Running</p>
    </div>

    <div id="questions-container"></div>

    <div id="system-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(3,7,18,0.95); z-index:1000; display:none; justify-content:center; align-items:center; opacity:0; transition: 0.5s;">
        <div id="message-box" style="background:#0c1020; border: 2px solid var(--accent-theme); padding: 40px; border-radius: 24px; text-align:center; box-shadow: 0 0 50px rgba(0,0,0,0.8); max-width: 80%;">
            <h2 id="msg-title" style="color:var(--accent-theme); text-transform:uppercase; letter-spacing:3px; margin-top:0;"></h2>
            <p id="msg-body" style="font-size:1.1rem; line-height:1.6; color:#cbd5e1;"></p>
            <button class="action-btn" id="close-msg-btn" style="margin-top:20px;">SESSION COMPLETE</button>
        </div>
    </div>

    <div id="result-score">
        SYNC ACCURACY: <span id="score-value">0</span> / <span id="total-value">0</span>
    </div>

    <div class="controls">
        <button class="action-btn" onclick="location.href='../../test-hub.html'">BACK TO HUB</button>
        <button id="submit-btn" class="action-btn">SUBMIT ANSWERS</button>
    </div>
</div>

<script type="module" src="./test-telemetry.js"></script>

</body>
</html>
