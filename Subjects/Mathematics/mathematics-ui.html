<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra Academy | Mathematics Module</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00d4ff;
            --bg: #050505;
            --item-h: 60px;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- ASTRA ACADEMY CENTERED LOGO BUTTON --- */
        .logo-home-btn {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            height: 100px;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-home-btn img {
            height: 100%;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.3));
            transition: filter 0.2s ease;
        }

        .logo-home-btn:hover {
            transform: translateX(-50%) scale(1.03);
        }

        .logo-home-btn:hover img {
            filter: drop-shadow(0 0 15px var(--accent));
        }

        /* --- SYMMETRICAL MENU TAB --- */
        .menu-btn {
            position: fixed;
            top: 35px;
            left: 35px;
            z-index: 1000;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            padding: 10px;
        }

        .bar {
            width: 30px;
            height: 2px;
            background: var(--accent);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--accent);
            border-radius: 2px;
        }

        .menu-btn.open #bar1 { transform: translateY(8px) rotate(-45deg); }
        .menu-btn.open #bar2 { opacity: 0; transform: translateX(-10px); }
        .menu-btn.open #bar3 { transform: translateY(-8px) rotate(45deg); }

        .sidenav {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            background: rgba(0, 8, 15, 0.98);
            backdrop-filter: blur(15px);
            overflow-x: hidden;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 1px solid rgba(0, 212, 255, 0.2);
        }

        .sidenav a {
            padding: 20px 40px;
            text-decoration: none;
            font-size: 1.1rem;
            color: #444;
            display: block;
            transition: 0.3s;
            letter-spacing: 3px;
        }

        .sidenav a:hover { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

        /* --- MAIN UI CONTAINER --- */
        .ui-wrapper {
            width: 100%;
            max-width: 450px;
            text-align: center;
            transform: translateY(-20px);
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 1.6rem;
            letter-spacing: 8px;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            color: #fff;
        }

        h1 span {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent);
        }

        /* --- PICKER SYSTEM (IMPROVED VIEWPORT) --- */
        .picker-viewport {
            position: relative;
            height: 240px;
            width: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, rgba(0, 212, 255, 0.03) 0%, transparent 70%);
            border-radius: 8px;
            mask-image: linear-gradient(to bottom, transparent, black 35%, black 65%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 35%, black 65%, transparent);
        }

        .target-brackets {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: var(--item-h);
            border-left: 2px solid var(--accent);
            border-right: 2px solid var(--accent);
            pointer-events: none;
            z-index: 10;
            box-shadow: inset 0 0 15px rgba(0, 212, 255, 0.05);
        }

        /* Subtle glowing geometric crosshairs for a cooler interface look */
        .target-brackets::before, .target-brackets::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 2px;
            background: var(--accent);
        }
        .target-brackets::before { top: 0; left: 0; }
        .target-brackets::after { bottom: 0; right: 0; }

        .scroll-list {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            padding-top: 90px; 
            padding-bottom: 90px; 
            box-sizing: border-box;
        }

        .scroll-list::-webkit-scrollbar { display: none; }

        .resource-item {
            height: var(--item-h);
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            font-size: 1.2rem;
            color: #1a1a1a;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- CONTROLS / BUTTONS --- */
        .btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 40px;
        }

        .btn-access {
            background: rgba(0, 212, 255, 0.03);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 15px 45px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            letter-spacing: 2px;
            width: 280px;
        }

        .btn-access:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 30px var(--accent);
        }

        .btn-back {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #666;
            padding: 10px 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            clip-path: polygon(8% 0%, 100% 0%, 92% 100%, 0% 100%);
            letter-spacing: 2px;
            width: 200px;
        }

        .btn-back:hover {
            border-color: #fff;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <a href="../Homepage/homepage.html" class="logo-home-btn">
        <img src="../../Images/1000008805-removebg-preview.png" alt="Astra Academy Logo">
    </a>

    <div class="menu-btn" id="menuBtn" onclick="toggleMenu()">
        <div class="bar" id="bar1"></div>
        <div class="bar" id="bar2"></div>
        <div class="bar" id="bar3"></div>
    </div>

    <div id="sideNav" class="sidenav">
        <div style="height: 120px;"></div>
        <a href="../Other/test-hub.html">ARCHIVED TESTS</a>
        <a href="#">ENCRYPTED</a>
        <a href="#">ENCRYPTED</a>
        <a href="#" style="color: #ff4d4d; margin-top: 40px;">ENCRYPTED</a>
    </div>

    <div class="ui-wrapper">
        <h1>MODULE // <span>MATHEMATICS</span></h1>

        <div class="picker-viewport">
            <div class="target-brackets"></div>
            <div class="scroll-list" id="picker">
                </div>
        </div>

        <div class="btn-container">
            <button class="btn-access" onclick="launch()">ACCESS RESOURCE</button>
            <button class="btn-back" onclick="location.href='../../Other/sub-selection.html'">RETURN TO HUB</button>
        </div>
    </div>

    <script>
        // Learning resources list 
        const lresources = [
            { name: 'Math Test', url: '../../Other/coming-soon.html' },
            { name: 'Algebra Core', url: '../../Other/coming-soon.html' },
            { name: 'Calculus Intro', url: '../../Other/coming-soon.html' },
            { name: 'Geometry Framework', url: '../../Other/coming-soon.html' }
        ];

        const picker = document.getElementById('picker');
        let currentSelection = "";

        // Generate Resources List UI
        lresources.forEach(res => {
            const div = document.createElement('div');
            div.className = 'resource-item';
            div.innerText = res.name;
            div.dataset.url = res.url; 
            picker.appendChild(div);
        });

        // Handle focus visualization during manual scrolling
        picker.addEventListener('scroll', () => {
            const items = document.querySelectorAll('.resource-item');
            const viewportRect = picker.getBoundingClientRect();
            const centerPoint = viewportRect.top + (viewportRect.height / 2);

            items.forEach(item => {
                const itemRect = item.getBoundingClientRect();
                const itemCenter = itemRect.top + (itemRect.height / 2);
                const distance = Math.abs(centerPoint - itemCenter);
                
                // Active configuration
                if (distance < 35) {
                    item.style.color = "var(--accent)";
                    item.style.opacity = "1";
                    item.style.transform = "scale(1.15)";
                    item.style.textShadow = "0 0 15px var(--accent)";
                    currentSelection = item.dataset.url; 
                } else {
                    // Out-of-focus layout elements
                    item.style.color = "#222";
                    item.style.opacity = "0.3";
                    item.style.transform = "scale(0.9)";
                    item.style.textShadow = "none";
                }
            });
        });

        // Initialize focus state on component mount
        window.onload = () => {
            picker.dispatchEvent(new Event('scroll'));
        };

        // Sidebar Navigation Toggler
        function toggleMenu() {
            const btn = document.getElementById('menuBtn');
            const nav = document.getElementById('sideNav');
            btn.classList.toggle('open');
            nav.style.width = btn.classList.contains('open') ? "280px" : "0";
        }

        // Action launch window function
        function launch() {
            if (currentSelection && currentSelection !== '#') {
                window.location.href = currentSelection;
            } else if (currentSelection === '#') {
                alert("SYSTEM UPDATE: CONTENT IS CURRENTLY ENCRYPTED OR COMING SOON.");
            } else {
                alert("SYSTEM ERROR: INVALID ACCESS ROUTE");
            }
        }
    </script>
</body>
</html>
